[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/worker",
  "crates/cli",
  "crates/engines/pdfium",
  "crates/engines/qpdf",
  "crates/engines/lopdf-ops",
  "crates/engines/raster",
  "crates/engines/ocr-tesseract",
  "crates/engines/office-libreoffice",
  "crates/engines/office-msoffice",
  "crates/engines/html-webview2",
  "crates/engines/sign-cms",
  "crates/engines/pdfa-verapdf",
  "crates/engines/ai-llamacpp",
  "crates/engines/gs-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Srishanth-023/quirewise"
authors = ["Quirewise contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
proptest = "1"
domain = { path = "crates/domain", package = "quirewise-domain" }
application = { path = "crates/application", package = "quirewise-application" }
infrastructure = { path = "crates/infrastructure", package = "quirewise-infrastructure" }

[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
