[package]
name = "quirewise-worker"
description = "Quirewise worker process: the only process that parses untrusted PDF bytes, run inside a Job Object."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "quirewise_worker"
path = "src/lib.rs"

[[bin]]
name = "quirewise-worker"
path = "src/main.rs"

[dependencies]
domain.workspace = true
application.workspace = true
infrastructure.workspace = true
quirewise-engine-pdfium = { path = "../engines/pdfium" }
quirewise-engine-qpdf = { path = "../engines/qpdf" }
quirewise-engine-lopdf-ops = { path = "../engines/lopdf-ops" }
quirewise-engine-raster = { path = "../engines/raster" }
quirewise-engine-office-libreoffice = { path = "../engines/office-libreoffice" }
quirewise-engine-office-msoffice = { path = "../engines/office-msoffice" }
quirewise-engine-html-webview2 = { path = "../engines/html-webview2" }
quirewise-engine-ocr-tesseract = { path = "../engines/ocr-tesseract" }
quirewise-engine-export = { path = "../engines/export" }

[dev-dependencies]
test-support.workspace = true
quirewise-cli = { path = "../cli" }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiff = "0.11.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
lopdf = { version = "0.45.0", default-features = false }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
