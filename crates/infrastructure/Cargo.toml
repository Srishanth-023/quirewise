[package]
name = "quirewise-infrastructure"
description = "Adapters for Quirewise ports: file store, settings, logging, components, job queue and worker supervisor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
domain.workspace = true
application.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "1.1"
sha2 = "0.10"
time = { version = "0.3", features = ["local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry", "std"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
