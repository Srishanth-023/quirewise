# cargo-deny policy. Allowed licenses mirror AGENTS.md section 9.
[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `rsa` timing differences (Marvin attack): no fixed release. Quirewise only signs and
  # verifies locally and never decrypts for a remote party, so nobody can time it.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used for local signing and checking only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "OFL-1.1",
  "Unicode-3.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# AGPL engines are never linked into the core (docs/project/MASTER_PROMPT.md section 2).
deny = [
  { name = "mupdf" },
  { name = "mupdf-sys" },
  { name = "ghostscript" },
  { name = "pdf_signer" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
